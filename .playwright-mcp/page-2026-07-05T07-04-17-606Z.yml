      - generic [ref=f4e97]: 【论文信息】 标题：Omnimodal World Models for Physical AI 作者：NVIDIA Cosmos Team 来源：arXiv 2026 论文链接：https://arxiv.org/abs/2606.02800 【核心亮点】 首次将语言、图像、视频、音频、动作五模态统一到一个MoT架构中 Cosmos3-Super在理解和生成任务上全面超越专用开源模型 被Artificial Analysis评为最佳开源T2I和I2V模型 被RoboArena评为最佳策略模型，三版本开源（Edge/Nano/Super） 【内容概要】 本文提出Cosmos 3，一个面向物理AI的全模态世界模型家族，统一处理语言、图像、视频、音频与动作五大模态。基于Mixture-of-Transformers架构，Cosmos 3可在不修改架构的情况下切换为VLM、T2I生成器、T2V/I2V视频模型和世界-动作模型。三个模型版本（Edge 4B、Nano 16B、Super 64B）覆盖端侧到数据中心，在理解与生成任务上全面达到SOTA。代码、模型、数据集和评测基准全部开源。 本视频由 AI 自动生成，仅供学术交流使用。
